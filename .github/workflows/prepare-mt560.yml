name: Prepare MT560 Bemba Translation Pack

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prepare-mt560.yml"

permissions:
  contents: write

jobs:
  prepare-mt560:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BembaHub backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Parquet reader
        run: |
          python -m pip install --upgrade pip
          pip install pyarrow huggingface_hub

      - name: Download MT560 and build JSONL
        run: |
          mkdir -p data/translation
          python <<'PY'
          from huggingface_hub import hf_hub_download
          import pyarrow.parquet as pq
          import json
          from pathlib import Path

          repo_id = "michsethowusu/english-bemba_sentence-pairs_mt560"
          parquet = hf_hub_download(
              repo_id=repo_id,
              filename="data/train-00000-of-00001.parquet",
              repo_type="dataset",
          )

          table = pq.read_table(parquet, columns=["eng", "bem"])
          output = Path("data/translation/mt560-english-bemba.jsonl")

          written = 0
          with output.open("w", encoding="utf-8") as f:
              for en, bm in zip(table["eng"].to_pylist(), table["bem"].to_pylist()):
                  en = str(en or "").strip()
                  bm = str(bm or "").strip()
                  if not en or not bm or en == bm:
                      continue
                  f.write(json.dumps({"eng": en, "bem": bm}, ensure_ascii=False) + "\n")
                  written += 1

          print("Rows written:", written)
          print("Output:", output)
          print("Bytes:", output.stat().st_size)
          PY

      - name: Add MT560 attribution
        run: |
          cat > data/translation/MT560-ATTRIBUTION.md <<'EOF'
          # OPUS MT560 English-Bemba Attribution

          Dataset: michsethowusu/english-bemba_sentence-pairs_mt560
          Source: https://huggingface.co/datasets/michsethowusu/english-bemba_sentence-pairs_mt560
          License: CC-BY-4.0
          Upstream: OPUS MT560

          BembaHub retains attribution to the dataset and its upstream source.
          EOF

      - name: Commit generated MT560 pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/translation/mt560-english-bemba.jsonl data/translation/MT560-ATTRIBUTION.md
          git diff --cached --quiet || git commit -m "Add generated MT560 English-Bemba translation pack"
          git pull --rebase origin main
          git push origin HEAD:main
