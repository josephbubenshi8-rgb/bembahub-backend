name: Prepare Liseli Dictionary Pack

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prepare-liseli.yml"

permissions:
  contents: write

jobs:
  prepare-liseli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BembaHub backend
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Datasets
        run: |
          python -m pip install --upgrade pip
          pip install "datasets>=3,<5"

      - name: Download Liseli dictionary and build JSONL
        run: |
          mkdir -p data/dictionary
          python <<'PY'
          from datasets import load_dataset
          import json
          from pathlib import Path

          dataset_id = "GiJoeHansFranz/Liseli"
          output = Path("data/dictionary/liseli-7-language.jsonl")

          print("Loading Liseli dictionary configuration...")
          ds = load_dataset(dataset_id, "dictionary", split="train")

          print("Rows:", len(ds))
          print("Columns:", ds.column_names)

          required = {"english", "language", "translation", "status"}
          missing = required - set(ds.column_names)
          if missing:
              raise RuntimeError(f"Missing expected columns: {sorted(missing)}")

          with output.open("w", encoding="utf-8") as f:
              for row in ds:
                  record = {
                      "english": str(row.get("english") or "").strip(),
                      "language": str(row.get("language") or "").strip(),
                      "translation": str(row.get("translation") or "").strip(),
                      "status": str(row.get("status") or "").strip(),
                  }
                  if record["english"] and record["language"] and record["translation"]:
                      f.write(json.dumps(record, ensure_ascii=False) + "\n")

          print("Created:", output)
          print("Bytes:", output.stat().st_size)
          PY

      - name: Add Liseli attribution
        run: |
          cat > data/dictionary/LISELI-ATTRIBUTION.md <<'EOF'
          # Liseli Dictionary Attribution

          Source: Liseli — Zambian Language Dataset
          Dataset: GiJoeHansFranz/Liseli
          Source: https://huggingface.co/datasets/GiJoeHansFranz/Liseli
          License: CC-BY-SA-4.0

          BembaHub retains attribution to Liseli and should comply with the
          applicable Creative Commons Attribution-ShareAlike 4.0 terms and
          any upstream license requirements identified by the dataset authors.
          EOF

      - name: Commit generated dictionary pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dictionary/liseli-7-language.jsonl data/dictionary/LISELI-ATTRIBUTION.md
          git diff --cached --quiet || git commit -m "Add generated Liseli 7-language dictionary pack"
          git push
