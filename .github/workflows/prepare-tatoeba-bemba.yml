name: Prepare Tatoeba English-Bemba Dictionary Pack

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prepare-tatoeba-bemba.yml"

permissions:
  contents: write

jobs:
  prepare-tatoeba-bemba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BembaHub backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build single-word English-Bemba dictionary pack
        run: |
          set -euo pipefail
          mkdir -p data/dictionary /tmp/tatoeba
          cd /tmp/tatoeba
          curl -fL --retry 5 --retry-delay 2 \
            -o bem-eng.txt.zip \
            https://object.pouta.csc.fi/OPUS-Tatoeba/v2026-07-08/moses/bem-eng.txt.zip
          unzip -o bem-eng.txt.zip
          ls -lh
          BEM_FILE="$(find . -maxdepth 1 -type f -name '*bem' | head -n 1)"
          ENG_FILE="$(find . -maxdepth 1 -type f -name '*eng' | head -n 1)"
          if [ -z "$BEM_FILE" ] || [ -z "$ENG_FILE" ]; then
            echo "Could not find aligned .bem and .eng files in the OPUS archive"
            exit 1
          fi
          echo "Bemba file: $BEM_FILE"
          echo "English file: $ENG_FILE"
          python <<'PY'
          import json, re
          from pathlib import Path
          root = Path("/tmp/tatoeba")
          bem_file = next(root.glob("*bem"))
          eng_file = next(root.glob("*eng"))
          def one_word(s):
              s = " ".join(s.strip().split())
              return bool(re.fullmatch(r"[A-Za-zÀ-ÖØ-öø-ÿĀ-ž'’\-]+", s))
          seen = set()
          rows = []
          with bem_file.open("r", encoding="utf-8") as bf, eng_file.open("r", encoding="utf-8") as ef:
              for bem_raw, eng_raw in zip(bf, ef):
                  bm = " ".join(bem_raw.strip().split())
                  en = " ".join(eng_raw.strip().split())
                  if not bm or not en:
                      continue
                  if not one_word(bm) or not one_word(en):
                      continue
                  key = (en.casefold(), bm.casefold())
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append({"eng": en, "bem": bm, "source": "Tatoeba", "license": "CC-BY-2.0-FR"})
          rows.sort(key=lambda x: (x["eng"].casefold(), x["bem"].casefold()))
          out = Path("/home/runner/work/bembahub-backend/bembahub-backend/data/dictionary/tatoeba-english-bemba-words.jsonl")
          out.parent.mkdir(parents=True, exist_ok=True)
          with out.open("w", encoding="utf-8") as f:
              for row in rows:
                  f.write(json.dumps(row, ensure_ascii=False) + "\n")
          print("Dictionary word pairs written:", len(rows))
          print("Output bytes:", out.stat().st_size)
          if len(rows) == 0:
              raise RuntimeError("No single-word English-Bemba pairs were extracted")
          PY

      - name: Add Tatoeba attribution
        run: |
          cat > data/dictionary/TATOEBA-BEMBA-ATTRIBUTION.md <<'EOF'
          # Tatoeba English-Bemba Dictionary Attribution

          Source: Tatoeba
          Tatoeba project: https://tatoeba.org/
          OPUS/Tatoeba release: https://github.com/Helsinki-NLP/Tatoeba-Challenge
          License: CC BY 2.0 FR for the Tatoeba textual data; attribution required.

          BembaHub uses only aligned single-word English-Bemba pairs selected from
          the Tatoeba English-Bemba parallel corpus. The generated pack is a
          derived selection, not a copy of the complete Tatoeba corpus.

          Required attribution: "Tatoeba.org and its contributors", used under
          CC BY 2.0 FR.
          EOF

      - name: Commit generated Tatoeba dictionary pack
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dictionary/tatoeba-english-bemba-words.jsonl data/dictionary/TATOEBA-BEMBA-ATTRIBUTION.md
          git diff --cached --quiet || git commit -m "Add Tatoeba English-Bemba dictionary pack"
          git pull --rebase origin main
          git push origin HEAD:main